name: railone
description: "RailOne - Recreated Indian Railways Super App (CRIS Aikyam)"
publish_to: "none"
version: 2.1.79+253

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  get: ^4.6.6

  # UI Design System & Component Library
  carousel_slider: ^5.0.0
  dots_indicator: ^3.0.0
  pin_code_fields: ^8.0.1
  slider_button: ^2.1.0

  # Barcode, PDF & Utilities
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/others/kml/
    - assets/locales/
    - assets/certificates/
    - assets/fonts/
